[package]
name = "qumail_crypto_mobile"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
jni = "0.21"
serde_json = "1.0"
zeroize = "1.7"

# Post-quantum algorithms matching Desktop QuMail
# Sequoia OpenPGP / Rust-Crypto PQ crates
[dependencies.sequoia-openpgp]
version = "2.4.1"
default-features = false
features = ["crypto-openssl", "compression"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
