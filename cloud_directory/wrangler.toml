name = "qumail-directory"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# 1. D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "qumail-directory-db"
database_id = "1504f965-3bf4-48d1-a771-dd6b3839f06b"

# 2. Hourly Scheduled Purge Trigger
[triggers]
crons = ["0 * * * *"]

# 3. Environment Variables (Public/Non-secret defaults)
[vars]
DIRECTORY_VERSION = "1.0.0"
ENVIRONMENT = "production"
DEV_MOCK_OTP = "false"
MAX_WEBLINK_SIZE_BYTES = 262144 # 256 KB

# Secrets must be configured via wrangler secret put:
# - DIRECTORY_PEPPER (High-entropy 256-bit hex, CANNOT BE ROTATED)
# - RESEND_API_KEY (Resend email delivery key)
# - TURNSTILE_SECRET_KEY (Cloudflare Turnstile secret)
# - GOOGLE_CLIENT_ID (Google OAuth Client ID for OIDC verification)
