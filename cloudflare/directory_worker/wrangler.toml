name = "qumail-directory"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[vars]
DIRECTORY_VERSION = "v1"
PROFILE_ID = "QM-OPENPGP-PQ-v1"
AUTHORITY_NAME = "QuMail National Quantum Key Directory"

# -------------------------------------------------------------
# D1 Database Bindings (Authoritative Relational Key Store)
# -------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "qumail-directory-db"
database_id = "qumail-d1-placeholder-id"
migrations_dir = "migrations"

# -------------------------------------------------------------
# Staging Environment
# -------------------------------------------------------------
[env.staging]
name = "qumail-directory-staging"
vars = { ENVIRONMENT = "staging" }
[[env.staging.d1_databases]]
binding = "DB"
database_name = "qumail-directory-staging-db"
database_id = "qumail-d1-staging-id"

# -------------------------------------------------------------
# Production Environment
# -------------------------------------------------------------
[env.production]
name = "qumail-directory-prod"
vars = { ENVIRONMENT = "production" }
routes = [
  { pattern = "directory.qumail.org/*", zone_name = "qumail.org" }
]
[[env.production.d1_databases]]
binding = "DB"
database_name = "qumail-directory-prod-db"
database_id = "qumail-d1-prod-id"
