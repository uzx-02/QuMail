[package]
name = "qumail_crypto"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "qumail_crypto"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "=1.0.103"
sequoia-openpgp = { version = "=2.4.1", default-features = false, features = ["crypto-rust", "allow-experimental-crypto", "allow-variable-time-crypto"] }
ml-dsa = { version = "0.1.2", features = ["zeroize"] }
rsa = { version = "0.10.0", features = ["pkcs1v15"] }
crypto-bigint = "0.7.11"
getrandom = "0.4"
hybrid-array = { version = "0.4", features = ["zeroize"] }
zeroize = "=1.9.0"
rand = "=0.8.8"
mailparse = "=0.17.0"
serde_json = "=1.0.151"
serde = { version = "1.0", features = ["derive"] }
jni = "0.21"
aes-gcm = "0.10"
